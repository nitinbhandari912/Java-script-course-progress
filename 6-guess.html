<!DOCTYPE html>
<html>
  <head>
    <title>Guess Game
    </title>
  </head>
  <body>
    <button onclick="
        guess+='Heads';
        console.log('You choosed Heads');
        console.log(`The Pc choose ${result}`);
        result===guess ? console.log('Your Guess is correct') : console.log('Your Guess is incorrect'); 
      ">
      Heads
    </button>
    <button onclick="
        guess+='Tails';
        console.log('You choosed Tails');
        console.log(`The Pc choose ${result}`);
        result===guess ? console.log('Your Guess is correct') : console.log('Your Guess is incorrect'); 
    ">
      Tails
    </button>
    <script>
      const randomNo= Math.random();
      let result='';
      if(randomNo<0.5){
        result+= 'Heads';
      }
      else {
        result+='Tails';
      }
      let guess='';

    </script>
  </body>
</html>
