<!DOCTYPE html>
<html>
  <head>
    <title>
      hour
    </title>
  </head>
  <body>
    <script>
      let hour=17;
      if(hour>=6 && hour<12){
        console.log('Good Morning');
      }
      if(hour>=12 && hour<17){
        console.log('Good Afternoon');
      }
      if(hour>=17 && hour<24){
        console.log('Good Night');
      }
    </script>
  </body>
</html>
