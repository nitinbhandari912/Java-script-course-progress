<!DOCTYPE html>
<html>
  <head>
    <title>
      Boolean
    </title>
    
  </head>
  <body>
    <script>
      console.log(typeof true);
      console.log(typeof 'true');
      console.log(3>5);
      console.log(5=='5.00'); //== tries to make values equel like this time it tries to make it in same format like both in string or both in number and this same rule applies to !=
      console.log(5==='5.00'); // it just checks witout any convertion or any efforts and same for !==
      if (true){
        console.log('hello');
      }
      if (false){
        console.log('hello');
      }
      else{
        console.log('else');
      }
      if(30>=16){
        console.log('you can drive');
      }
      else{
        console.log('You can not drive');
      }
      if(5){
        console.log('truthy');
      }
      if(0){
        console.log('falsy');//other falsy values are False , 0 , NaN , undefined , null
      }
      // Turnery value
      const result = true ? 'truthy': 'falsy';
      //Guard operator
      false && console.log('hello');
      const message = 5 && 'hello'; //answer is hello
      const msg = false && 'hello'; //answer is false
      //default operator
      const currency = 'EUR' || 'USD'; // answer will be EUR as first is true
      const curr = undefined || 'USD' // now the answer will be USD as the first value is false
    </script>
  </body>
</html>
